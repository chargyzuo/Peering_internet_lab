---
# 03-config.yml —— 模板渲染 + 幂等下发（对应 2.1 §3-§六 / 2.2 §三.3）
- name: 下发 FRR RR 配置
  hosts: rr1,rr2
  become: true
  tasks:
    - name: 渲染 frr.conf (RR)
      template:
        src: ../templates/frr_rr.conf.j2
        dest: /etc/frr/frr.conf
        owner: frr
        group: frr
      notify: reload frr
  handlers:
    - name: reload frr
      command: /usr/lib/frr/frr-reload.py --reload /etc/frr/frr.conf

- name: 下发 FRR 外部对端配置 (Transit/Eyeball/CDN)
  hosts: transit1,transit2,eyeballA,eyeballC,cdn
  become: true
  tasks:
    - name: 渲染 frr.conf (peer)
      template:
        src: ../templates/frr_peer.conf.j2
        dest: /etc/frr/frr.conf
        owner: frr
        group: frr
      notify: reload frr
  handlers:
    - name: reload frr
      command: /usr/lib/frr/frr-reload.py --reload /etc/frr/frr.conf

- name: 下发 BIRD(RS) 配置
  hosts: bird
  become: true
  tasks:
    - template: { src: ../templates/bird_rs.conf.j2, dest: /etc/bird/bird.conf }
      notify: reconfigure bird
  handlers:
    - name: reconfigure bird
      command: birdc configure

- name: 下发 Routinator SLURM(本地 ROA) —— 零出网，仅本地 ROA 演示 ROV 三态
  hosts: rpki
  become: true
  tasks:
    - name: 下发 SLURM(本地 ROA/例外)
      template: { src: ../templates/slurm.json.j2, dest: /etc/routinator/slurm.json }
      notify: restart routinator
    # 关键三行,让 server 零出网、只服务本地 ROA：
    #  no-rir-tals=true  -> 不加载编译进二进制的 5 个 RIR TAL,不去拉全球 RPKI(2.6GB 省掉)
    #  disable-rsync=true -> 关掉 rsync 回退(本机没装 rsync,避免每源等超时)
    #  exceptions=[slurm] -> 把 SLURM 里的本地 ROA 作为唯一 VRP 来源
    # rtr-listen -> RTR 协议监听,给 XRv9k BR 拉 VRP(rpki server 0.0.0.0:3323)
    - name: routinator.conf 写入本地 ROA 运行参数(幂等)
      lineinfile:
        path: /etc/routinator/routinator.conf
        regexp: "^{{ item.k }}\\s*="
        line: "{{ item.k }} = {{ item.v }}"
        create: true
      loop:
        - { k: "no-rir-tals",  v: "true" }
        - { k: "disable-rsync", v: "true" }
        - { k: "exceptions",   v: '["/etc/routinator/slurm.json"]' }
        - { k: "rtr-listen",   v: '["0.0.0.0:3323"]' }
      loop_control: { label: "{{ item.k }}" }
      notify: restart routinator
  handlers:
    - name: restart routinator
      service: { name: routinator, state: restarted, enabled: true }

- name: 下发 BR(XRv9k) 配置 —— 先策略后主体
  hosts: xr
  gather_facts: false
  tasks:
    - name: 渲染 route-policy 集到本地
      template:
        src: ../templates/xr_policy.conf.j2
        dest: "/tmp/xr_policy_{{ inventory_hostname }}.conf"
      delegate_to: localhost

    - name: 渲染 BR 主体配置到本地
      template:
        src: "../templates/xr_{{ inventory_hostname }}.conf.j2"
        dest: "/tmp/xr_{{ inventory_hostname }}.conf"
      delegate_to: localhost

    - name: 合并下发 route-policy 集
      cisco.iosxr.iosxr_config:
        src: "/tmp/xr_policy_{{ inventory_hostname }}.conf"

    - name: 合并下发 BR 主体 (IS-IS+iBGP+边界+RPKI+uRPF)
      cisco.iosxr.iosxr_config:
        src: "/tmp/xr_{{ inventory_hostname }}.conf"
      register: xr_res

    - debug: { var: xr_res.commands }
