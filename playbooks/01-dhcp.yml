---
# 01-dhcp.yml —— 控制节点起 DHCP，MAC 绑定固定 IP（对应 2.2 §三.1）
- name: 配置管理网 DHCP（MAC 绑定固定 IP）
  hosts: localhost
  connection: local
  become: true
  tasks:
    - name: 停用 Kea（若存在），避免抢占 UDP/67 与 isc-dhcp-server 冲突
      systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - kea-dhcp4-server
        - kea-dhcp4
        - kea-dhcp-ddns-server
        - kea-ctrl-agent
      failed_when: false

    - name: 安装 isc-dhcp-server
      apt:
        name: isc-dhcp-server
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: 确保 leases 文件存在（dhcpd 启动前置，缺失会直接退出）
      copy:
        content: ""
        dest: /var/lib/dhcp/dhcpd.leases
        force: false
        owner: root
        group: root
        mode: "0644"

    - name: 渲染 dhcpd.conf
      template:
        src: ../templates/dhcpd.conf.j2
        dest: /etc/dhcp/dhcpd.conf
      notify: restart dhcp

    - name: 指定 DHCP 监听管理网口 (EVE-NG e0 = ens3)
      lineinfile:
        path: /etc/default/isc-dhcp-server
        regexp: '^INTERFACESv4='
        line: 'INTERFACESv4="ens3"'
      notify: restart dhcp

  handlers:
    - name: restart dhcp
      service: { name: isc-dhcp-server, state: restarted, enabled: true }
