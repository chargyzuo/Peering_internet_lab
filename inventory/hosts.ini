# ============================================================
# inventory —— 按角色分组，IP 与 group_vars/all.yml 的 dhcp_hosts 一一对应
# 全部为 DHCP MAC 绑定的固定管理 IP（见 2.2 §三.1）
# ============================================================

[frr]              # RR + 上游 + eyeball + CDN，全跑 FRR
rr1      ansible_host=10.99.99.103
rr2      ansible_host=10.99.99.104
transit1 ansible_host=10.99.99.101
transit2 ansible_host=10.99.99.102
eyeballA ansible_host=10.99.99.107
eyeballB ansible_host=10.99.99.109
eyeballC ansible_host=10.99.99.106
cdn      ansible_host=10.99.99.105

[bird]             # IX Route-Server (router_server)
rs       ansible_host=10.99.99.108

[rpki]
routinator ansible_host=10.99.99.110

[netflow]
collector ansible_host=10.99.99.111

[xr]               # 两台边界 BR，走 network_cli；管理 IP 手动配静态（不走 DHCP 绑定）
br1 ansible_host=REPLACE_BR1_MGMT_IP   # 在 IOS-XR 上手动配 MgmtEth 静态 IP 后填入
br2 ansible_host=REPLACE_BR2_MGMT_IP   # 同上

[linux:children]
frr
bird
rpki
netflow

[linux:vars]
ansible_user=root
ansible_ssh_pass=Test@123
ansible_become=true
ansible_python_interpreter=/usr/bin/python3

[xr:vars]
ansible_network_os=cisco.iosxr.iosxr
ansible_connection=ansible.netcommon.network_cli
ansible_user=admin
ansible_password=admin
