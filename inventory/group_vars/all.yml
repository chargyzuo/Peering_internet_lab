# group_vars/all.yml —— 唯一事实源（Single Source of Truth）
# 对应 2.1 §3.1 编址表 + 2.2 §一 MAC 表 / §三.1 DHCP 表。改编址/策略只动这里。

# ===== AS / 前缀 =====
my_asn: 64496
my_prefix: "100.64.0.0/20"        # AS64496 宣告前缀(拆 /24 做 TE);与 slurm ROA(1)对齐

# ===== 阶段开关：先打通路由交换，暂不启用 RPKI ROV =====
# false → XR 不配 `rpki server`、不做 origin-as validation、策略里跳过 validation-state 判断，
#         eBGP 不依赖 Routinator 即可 up；等基础业务通了改 true 再叠加 RPKI。
enable_rpki: false

# ===== 核心 loopback（BR/RR），2.1 §3.1/§3.3 =====
lo:
  br1: 100.64.255.1
  br2: 100.64.255.2
  rr1: 100.64.255.11
  rr2: 100.64.255.12

# ===== IS-IS =====
isis_area: "49.0001"

# ===== RPKI（Routinator 管理 IP = §三.1 Routinator 的 IP）=====
rpki_rtr_host: 10.99.99.110
rpki_rtr_port: 3323

# ===== RPKI ROV 演示用本地 ROA(SLURM,零出网) =====
# 三态由「这里的 ROA」×「各 peer 实际宣告的前缀/origin」共同决定：
#   Valid    : 宣告前缀被某 ROA 覆盖,且 origin ASN 与 maxLength 都匹配
#   Invalid  : 前缀被 ROA 覆盖,但 origin 错 或 掩码 > maxLength
#   NotFound : 没有任何 ROA 覆盖该前缀
# 下面每条 ROA 会渲染进 slurm.json 的 prefixAssertions。演示脚本见 04-verify / 2.1 §RPKI。
roa_assertions:
  # (1) 本 AS 合法前缀 → 自己宣告即 Valid;maxLen 24 允许 TE 拆 /24 仍 Valid
  - { asn: 64496, prefix: "203.0.113.0/24", maxlen: 24,
      comment: "AS64496 合法宣告 → Valid(演示正常态)" }
  # (2) 给 Eyeball-A(64510) 的前缀发 ROA,origin 锁死 64510、maxLen 22。
  #     若 Eyeball-C(64511) 劫持宣告同前缀 → Invalid(origin 错);
  #     若有人宣告它的 /24(>22) → Invalid(超长)。二者任选其一演示 Invalid。
  - { asn: 64510, prefix: "198.51.100.0/22", maxlen: 22,
      comment: "ROA 属 AS64510 → 他人劫持/超长宣告即 Invalid" }
  # (3) NotFound 无需 ROA：CDN(64521) 宣告的 192.0.2.0/24 不被任何 ROA 覆盖 → 天然 NotFound


# ===== 管理网（2.1 §3.1 + 2.2 §二.1）=====
mgmt_net: 10.99.99.0
mgmt_mask: 255.255.255.0
mgmt_gw:  10.99.99.1
mgmt_dns: 223.5.5.5

# ===== DHCP MAC→固定IP 绑定（2.2 §一 + §三.1，与 inventory/hosts.ini 一一对应）=====
dhcp_hosts:
  - { name: Transit-1,     mac: "00:50:00:00:03:00",  ip: "10.99.99.101" }
  - { name: Transit-2,     mac: "00:50:00:00:04:00",  ip: "10.99.99.102" }
  - { name: RR1,           mac: "00:50:00:00:05:00",  ip: "10.99.99.103" }
  - { name: RR2,           mac: "00:50:00:00:06:00",  ip: "10.99.99.104" }
  - { name: CDN,           mac: "00:50:00:00:07:00",  ip: "10.99.99.105" }
  - { name: Eyeball-C,     mac: "00:50:00:00:08:00",  ip: "10.99.99.106" }
  - { name: Eyeball-A,     mac: "00:50:00:00:09:00",  ip: "10.99.99.107" }
  - { name: router_server, mac: "00:50:00:00:0a:00",  ip: "10.99.99.108" }
  - { name: Eyeball-B,     mac: "00:50:00:00:0b:00", ip: "10.99.99.109" }
  - { name: Routinator,    mac: "00:50:00:00:0c:00", ip: "10.99.99.110" }
  - { name: Netflow,       mac: "00:50:00:00:0d:00", ip: "10.99.99.111" }

# ===== 外部 ASN（2.1 §一 AS 角色表）=====
transit1_asn: 64500
transit2_asn: 64501
eyeballA_asn: 64510
eyeballC_asn: 64511
eyeballB_asn: 64520
cdn_asn:      64521
rs_asn:       65000

# ===== eBGP 对接链路 IP（2.1 §3.1 / 逐链路接线表 L5/L6/L12/L13）=====
# 基础业务打通用的 10.x/198.18.x 接口地址,自洽即可,后续可按 2.1 §3.1 调整。
transit_as64500_peer: "10.5.0.2"      # BR1↔Transit-1 对端=T1 (net 10.5.0.0/30, BR1=.1 T1=.2)
transit_as64501_peer: "10.5.0.6"      # BR2↔Transit-2 对端=T2 (net 10.5.0.4/30, BR2=.5 T2=.6)
pni_eyeballA_peer:    "10.12.0.2"     # BR1↔Eyeball-A 对端=A (net 10.12.0.0/30, BR1=.1 A=.2)
pni_eyeballC_peer:    "10.13.0.2"     # BR2↔Eyeball-C 对端=C (net 10.13.0.0/30, BR2=.1 C=.2)

# BR 边界口本端 IP(XR 上配在物理口;对端=上面各 *_peer)
br1_transit_ip: "10.5.0.1"            # BR1 Gi0/0/0/0 ↔ Transit-1
br2_transit_ip: "10.5.0.5"            # BR2 Gi0/0/0/0 ↔ Transit-2
br1_pni_ip:     "10.12.0.1"           # BR1 Gi0/0/0/3 ↔ Eyeball-A PNI
br2_pni_ip:     "10.13.0.1"           # BR2 Gi0/0/0/3 ↔ Eyeball-C PNI

# 核心 IS-IS /30 点对点:BR Gi0/0/0/1→RR1、Gi0/0/0/2→RR2 ; RR eth1→BR1、eth2→BR2
core_links:
  br1_rr1: { br: "10.0.1.1",  rr: "10.0.1.2"  }   # net 10.0.1.0/30
  br1_rr2: { br: "10.0.1.5",  rr: "10.0.1.6"  }   # net 10.0.1.4/30
  br2_rr1: { br: "10.0.1.9",  rr: "10.0.1.10" }   # net 10.0.1.8/30
  br2_rr2: { br: "10.0.1.13", rr: "10.0.1.14" }   # net 10.0.1.12/30

# ===== IX peering LAN（2.1 §3.1: RS=.1 BR1=.10 BR2=.11 EyeballB=.20 CDN=.21）=====
# 用 RFC2544 基准测试段 198.18.100.0/24 当 IX 平面,避免与业务/管理网冲突
ix_rs_ip:  "198.18.100.1"      # Route-Server (.1)
ix_br1_ip: "198.18.100.10"     # BR1 in IX (.10)
ix_br2_ip: "198.18.100.11"     # BR2 in IX (.11)
